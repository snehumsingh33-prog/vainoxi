services:
  - type: web
    name: daansetu
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: daansetu-data
      mountPath: /opt/render/project/src
      sizeGB: 1
